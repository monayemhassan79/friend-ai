<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friend AI - Your Best Friend</title>

  <style>
    /* ===============================
       1. VARIABLES
    =============================== */
    :root {
      --bg-main: #0d1117;
      --bg-card: #161b22;
      --bg-msg-ai: #21262d;
      --bg-msg-user: #238636;
      --border: #30363d;
      --text-main: #ffffff;
      --radius-msg: 16px;
      --radius-input: 24px;
    }

    /* ===============================
       2. RESET & BASE
    =============================== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg-main);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* ===============================
       3. HEADER
    =============================== */
    header {
      padding: 16px;
      text-align: center;
      background: var(--bg-card);
      font-weight: bold;
      font-size: 20px;
      border-bottom: 1px solid var(--border);
    }

    /* ===============================
       4. CHAT AREA
    =============================== */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* ===============================
       5. MESSAGES
    =============================== */
    .msg {
      padding: 12px 16px;
      border-radius: var(--radius-msg);
      max-width: 80%;
      line-height: 1.5;
      word-break: break-word;
    }

    .user {
      align-self: flex-end;
      background: var(--bg-msg-user);
    }

    .ai {
      align-self: flex-start;
      background: var(--bg-msg-ai);
    }

    /* ===============================
       6. INPUT BOX
    =============================== */
    #box {
      display: flex;
      padding: 12px;
      gap: 8px;
      background: var(--bg-card);
      border-top: 1px solid var(--border);
    }

    #box input {
      flex: 1;
      padding: 14px 18px;
      border-radius: var(--radius-input);
      border: 1px solid var(--border);
      background: var(--bg-main);
      color: var(--text-main);
      outline: none;
    }

    #box button {
      padding: 12px 22px;
      border-radius: var(--radius-input);
      border: none;
      background: var(--bg-msg-user);
      color: var(--text-main);
      cursor: pointer;
      font-weight: bold;
    }

    #box button:hover {
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <header>🤖 Friend AI - Made by Monayem</header>

  <div id="chat">
    <div class="msg ai">
      Hi! আমি Friend AI, তোমার নতুন বন্ধু। বলো কি help লাগবে?
    </div>
  </div>

  <div id="box">
    <input id="inp" placeholder="Message Friend AI..." />
    <button onclick="send()">Send</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    const inp = document.getElementById('inp');
    let history = [];

    async function send() {
      if (!inp.value.trim()) return;

      const text = inp.value;
      inp.value = '';

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      history.push({ role: 'user', content: text });
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });

        const data = await res.json();
        chat.innerHTML += `<div class="msg ai">${data.reply}</div>`;
        history.push({ role: 'assistant', content: data.reply });

      } catch (e) {
        chat.innerHTML += `<div class="msg ai">Error: ${e.message}</div>`;
      }

      chat.scrollTop = chat.scrollHeight;
    }

    inp.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') send();
    });
  </script>
</body>
</html>
