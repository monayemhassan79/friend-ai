<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Friend AI - Your Best Friend</title>
<style>
body{font-family:system-ui;background:#0d1117;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{padding:16px;text-align:center;background:#161b22;font-weight:bold;font-size:20px;border-bottom:1px solid #30363d}
#chat{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:16px;max-width:80%;line-height:1.5;word-break:break-word}
.user{align-self:flex-end;background:#238636}
.ai{align-self:flex-start;background:#21262d}
#box{display:flex;padding:12px;gap:8px;background:#161b22;border-top:1px solid #30363d}
input{flex:1;padding:14px 18px;border-radius:24px;border:1px solid #30363d;background:#0d1117;color:#fff;outline:none}
button{padding:12px 22px;border-radius:24px;border:none;background:#238636;color:#fff;cursor:pointer;font-weight:bold}
</style>
</head>
<body>
<header>🤖 Friend AI - Made by Monayem</header>
<div id="chat"><div class="msg ai">Hi! আমি Friend AI, তোমার নতুন বন্ধু। বলো কি help লাগবে?</div></div>
<div id="box"><input id="inp" placeholder="Message Friend AI..."><button onclick="send()">Send</button></div>
<script>
const chat=document.getElementById('chat');
const inp=document.getElementById('inp');
let history=[];
async function send(){
 if(!inp.value.trim())return;
 const text=inp.value;
 inp.value='';
 chat.innerHTML+=`<div class="msg user">${text}</div>`;
 history.push({role:'user',content:text});
 chat.scrollTop=chat.scrollHeight;
 try{
   const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})});
   const data=await res.json();
   chat.innerHTML+=`<div class="msg ai">${data.reply}</div>`;
   history.push({role:'assistant',content:data.reply});
 }catch(e){
   chat.innerHTML+=`<div class="msg ai">Error: ${e.message}</div>`;
 }
 chat.scrollTop=chat.scrollHeight;
}
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
