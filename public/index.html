<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friend AI - Made by Monayem</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-2: #2d2d2d;
    --border: #2a2a2a;
    --text: #ececec;
    --text-dim: #9a9a9a;
    --primary: #2a7fff;
    --primary-hover: #1a6fee;
  }
    * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  header {
    background: var(--surface);
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.3px;
  }

  /* Chat Area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  #chat::-webkit-scrollbar { width: 6px; }
  #chat::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

 .msg {
    max-width: 75%;
    padding: 14px 18px;
    border-radius: 20px;
    line-height: 1.6;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

 .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: white;
    border-bottom-right-radius: 6px;
  }
 .msg.ai {
    align-self: flex-start;
    background: var(--surface-2);
    color: var(--text);
    border-bottom-left-radius: 6px;
    border: 1px solid var(--border);
  }
 .msg img {
    max-width: 100%;
    max-height: 300px;
    border-radius: 12px;
    margin-top: 10px;
    object-fit: cover;
  }

  /* Image Preview Bar - ChatGPT style */
  #previewBar {
    display: none;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 16px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    align-items: center;
    gap: 12px;
  }
  #previewBar img {
    width: 64px;
    height: 64px;
    border-radius: 10px;
    object-fit: cover;
    border: 1px solid var(--border);
  }
  #previewBar span { flex: 1; font-size: 13px; color: var(--text-dim); }
  #previewBar button {
    background: #2a2a2a;
    color: white;
    border: 1px solid var(--border);
    padding: 6px 12px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 12px;
  }
  #previewBar button:hover { background: #ff4444; border-color: #ff4444; }

  /* Input Area - ChatGPT like */
  #inputWrapper {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 16px;
  }
  #inputArea {
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 8px 8px 8px 12px;
    border-radius: 28px;
    transition: border-color 0.2s;
  }
  #inputArea:focus-within { border-color: #3a3a3a; }

  #plusBtn {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
  }
  #plusBtn:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  #msgInput {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    outline: none;
    font-size: 15px;
    padding: 8px 0;
  }
  #msgInput::placeholder { color: var(--text-dim); }

  #sendBtn {
    background: var(--primary);
    color: white;
    border: none;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
    flex-shrink: 0;
  }
  #sendBtn:hover { background: var(--primary-hover); }
  #sendBtn:disabled { opacity: 0.4; cursor: not-allowed; }
</style>
</head>
<body>

<header>🤖 Friend AI <span style="color:var(--text-dim);font-weight:400;font-size:13px">Made by Monayem</span></header>

<div id="chat">
  <div class="msg ai">Hi Monayem! 👋 আমি Friend AI। কোনো ছবি থাকলে <b>+</b> বাটনে ক্লিক করে আপলোড করো, আমি দেখে হেল্প করবো।</div>
</div>

<div id="previewBar">
  <img id="previewImg" src="">
  <span>ছবি আপলোড হয়েছে ✓</span>
  <button onclick="removeImage()">✕ মুছো</button>
</div>

<div id="inputWrapper">
  <div id="inputArea">
    <input type="file" id="fileInput" accept="image/*" hidden>
    <button id="plusBtn" title="ছবি আপলোড করুন">+</button>
    <input id="msgInput" placeholder="Message Friend AI..." onkeydown="if(event.key==='Enter') send()">
    <button id="sendBtn" onclick="send()" title="Send">➤</button>
  </div>
</div>

<script>
let selectedImageBase64 = null;
const fileInput = document.getElementById('fileInput');
const previewBar = document.getElementById('previewBar');
const previewImg = document.getElementById('previewImg');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    selectedImageBase64 = e.target.result;
    previewImg.src = selectedImageBase64;
    previewBar.style.display = 'flex';
  };
  reader.readAsDataURL(file);
});

function removeImage(){
  selectedImageBase64 = null;
  fileInput.value = '';
  previewBar.style.display = 'none';
}

async function send(){
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if(!text &&!selectedImageBase64) return;
  const chat = document.getElementById('chat');
  let html = `${text? text.replace(/</g,'&lt;') : ''}`;
  if(selectedImageBase64) html += `<img src="${selectedImageBase64}">`;
  chat.innerHTML += `<div class="msg user">${html}</div>`;

  const payloadText = text || 'এই ছবিটা দেখে বিস্তারিত বলো';
  const imageToSend = selectedImageBase64;

  input.value = '';
  removeImage();
  chat.scrollTop = chat.scrollHeight;

  chat.innerHTML += `<div class="msg ai" id="typing">Friend AI লিখছে...</div>`;
  chat.scrollTop = chat.scrollHeight;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        message: payloadText,
        messages: [{role:'user', content: payloadText}],
        image: imageToSend
      })
    });
    const data = await res.json();
    document.getElementById('typing')?.remove();
    chat.innerHTML += `<div class="msg ai">${data.reply.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`;
  } catch(e){
    document.getElementById('typing')?.remove();
    chat.innerHTML += `<div class="msg ai">⚠️ Server busy! আবার চেষ্টা করো।</div>`;
  }
  chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
